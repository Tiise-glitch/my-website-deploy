<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enquiry | Paws And Hearts Animal Shelter</title>
    <link rel="stylesheet" href="../css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <header>
        <div>
            <a href="index.html" class="logo">Paws And Hearts</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="enquiry.html" class="active">Enquiry</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="form-page">
            <div class="intro">
                <h1>Send an Enquiry</h1>
                <p>Interested in adopting, volunteering, or becoming a sponsor? Fill in the form below and our team will get back to you.</p>
                <img src="../images/Animal Rescue.jpg" alt="Rescue">
            </div>
            
            <!-- client-details -->
            <div class="form-panel">
                <form action="#" method="POST">
                    <label for="fullname"><h2>Full Name</h2></label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    <hr>
                    
                    <label for="email"><h2>Email Address</h2></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    <hr>
                    
                    <h2>Am I Interested In</h2>
                    <ul>
                        <li>
                            <input type="checkbox" id="adopt" name="interest" value="adopting">
                            <label for="adopt">Adopting An Animal</label>
                        </li>
                        <li>
                            <input type="checkbox" id="volunteer" name="interest" value="volunteering">
                            <label for="volunteer">Volunteering</label>
                        </li>
                        <li>
                            <input type="checkbox" id="donate" name="interest" value="donating">
                            <label for="donate">Donating</label>
                        </li>
                        <li>
                            <input type="checkbox" id="sponsor" name="interest" value="sponsoring">
                            <label for="sponsor">Becoming A Sponsor</label>
                        </li>
                    </ul>
                    <hr>

                    <button type="submit" class="submit-btn">Submit Enquiry</button>
                </form>
            </div>
        </div>
    </main>

     <!-- Site footer: repeated on every page -->
    <footer>
        <div>
            <p>2026 Paws And Hearts Animal Shelter. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
