<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send an enquiry to Paws & Hearts to adopt an animal, volunteer, donate or become a sponsor.">
  <title>Enquiry | Paws & Hearts Animal Shelter</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">Paws &amp; Hearts</a>
      <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="enquiry.html" class="active">Enquiry</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-page">
      <div class="intro">
        <h1>Send an Enquiry</h1>
        <p>Interested in adopting, volunteering, or becoming a sponsor? Fill in the form below and our team will get back to you.</p>
        <img src="images/Animal Rescue.jpg" alt="A rescued animal being comforted and cared for by volunteers">
      </div>

      <div class="form-panel">
        <form id="enquiry-form" novalidate>
          <label for="name"><h2>Customer's Name</h2></label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>

          <label for="email"><h2>Email Address</h2></label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>

          <label for="phone"><h2>Contact Number</h2></label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your contact number" required>

          <label for="product"><h2>Product Interested In</h2></label>
          <select id="product" name="product" required>
            <option value="">Select a product</option>
            <option value="adoption">Adoption</option>
            <option value="volunteering">Volunteering</option>
            <option value="donation">Donation</option>
            <option value="sponsorship">Sponsorship</option>
          </select>

          <label for="message"><h2>Your Enquiry</h2></label>
          <textarea id="message" name="message" rows="5" placeholder="Tell us what you would like to know" required></textarea>

          <p class="form-message" aria-live="polite"></p>
          <button type="submit" class="submit-btn">Submit Enquiry</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>2026 Paws And Hearts Animal Shelter. All rights reserved.</p>
  </footer>
</body>
</html>
